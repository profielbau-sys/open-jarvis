name: Export Android Tools

on:
  push:
    branches:
      - sofie-control-2.8-build
  workflow_dispatch:

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          PLATFORM_DIR="$(find "$ANDROID_HOME/platforms" -maxdepth 1 -mindepth 1 -type d -name 'android-*' | sort -V | tail -1)"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "Platform: $PLATFORM_DIR"
          echo "Build tools: $BUILD_TOOLS_DIR"
          cp "$PLATFORM_DIR/android.jar" out/android.jar
          cp "$BUILD_TOOLS_DIR/lib/d8.jar" out/d8.jar
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" out/apksigner.jar
          cp "$BUILD_TOOLS_DIR/aapt2" out/aapt2
          cp "$BUILD_TOOLS_DIR/zipalign" out/zipalign
          if [ -d "$BUILD_TOOLS_DIR/lib64" ]; then cp -a "$BUILD_TOOLS_DIR/lib64" out/lib64; fi

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-tools-for-sofie
          path: out/
          retention-days: 1
